[ids]
*

[main]
# Home row modifier keys: hold past 200ms -> mod, release before that -> letter
a = overloadt2(control, a, 200)
s = overloadt2(alt, s, 200)
d = overloadt2(meta, d, 200)
f = overloadt2(shift, f, 200)

j = overloadt2(shift, j, 200)
k = overloadt2(meta, k, 200)
l = overloadt2(alt, l, 200)
semicolon = overloadt2(control, ;, 200)
