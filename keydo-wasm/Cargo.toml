[package]
name    = "keydo-wasm"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
serde        = { version = "1", features = ["derive"] }
serde_json   = "1"

[dependencies.keydo]
git = "https://github.com/argenkiwi/keydo"
rev = "9c072ee90c369080643094f9c07ffc2579e9044c"

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-Oz", "--enable-mutable-globals", "--enable-bulk-memory"]
